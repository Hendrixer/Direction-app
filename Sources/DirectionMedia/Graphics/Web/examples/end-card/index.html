<!doctype html>
<!--
  End card. The last card of the film: the picture fades to black, then a title, a short rule and
  one line under it. It holds until the end; nothing fades out, so the film ends on it.

  - Place it over the last shot so the fade to black happens inside the graphic.
  - Every line is a word. Leave `line` empty and it simply doesn't show.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --u: 1px; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #black { position: absolute; inset: 0; background: #000; }
  .card { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center; font-family: 'Archivo', sans-serif; color: #fff; }
  #title { margin: 0; font-weight: 800; font-size: calc(76 * var(--u)); font-stretch: 112%; line-height: 1; letter-spacing: -0.01em; }
  #rule { width: calc(72 * var(--u)); height: calc(2 * var(--u)); background: rgb(255 255 255 / 0.5); margin: calc(34 * var(--u)) auto; transform-origin: 50% 50%; }
  #line { font-weight: 500; font-size: calc(30 * var(--u)); color: rgb(255 255 255 / 0.78); }
</style>
</head>
<body>
<div id="black"></div>
<div class="card">
  <h1 id="title"></h1>
  <div id="rule"></div>
  <div id="line"></div>
</div>
<script>
  document.documentElement.style.setProperty('--u', innerHeight / 1080 + 'px');
  const u = innerHeight / 1080;
  const { ease, clamp } = direction;

  direction.graphic({
    duration: 6,
    words: {
      title: { label: 'Title', text: 'Launch film', max: 28 },
      line: { label: 'Line', text: 'Thank you for watching.', max: 48 },
    },
    render(t, words) {
      title.textContent = words.title;
      line.textContent = words.line;
      rule.style.display = words.line ? '' : 'none';
      black.style.opacity = ease.inOut(clamp(t / 1.0));
      const a = ease.out(clamp((t - 1.0) / 0.9)), r = ease.out(clamp((t - 1.5) / 0.7)), b = ease.out(clamp((t - 1.8) / 0.9));
      title.style.opacity = a;
      title.style.transform = `translateY(${(1 - a) * 12 * u}px)`;
      rule.style.transform = `scaleX(${r})`;
      line.style.opacity = b;
    },
  });
</script>
</body>
</html>
