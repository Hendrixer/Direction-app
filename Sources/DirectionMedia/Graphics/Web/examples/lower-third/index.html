<!doctype html>
<!--
  Lower third. A name and a role at the lower left, inside title safe. A short rule draws, the
  name rises out of a mask, the role follows, and both leave the way they came.

  - Both lines are words. `max` is set for the width the layout holds at this size.
  - The masks (overflow: hidden) hide the words while they slide; Direction checks only the part
    that shows, so a reveal isn't reported as overflow.
  - White text on footage: keep a soft shadow, and check the stills against the real picture.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --u: 1px; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .third { position: absolute; left: calc(144 * var(--u)); bottom: calc(150 * var(--u)); font-family: 'Archivo', sans-serif; color: #fff; }
  .rule { width: calc(56 * var(--u)); height: calc(3 * var(--u)); background: rgb(255 255 255 / 0.85); transform-origin: 0 50%; margin-bottom: calc(18 * var(--u)); }
  .mask { overflow: hidden; padding-bottom: calc(4 * var(--u)); }
  .line { display: block; white-space: nowrap; text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgb(0 0 0 / 0.45); }
  #name { font-weight: 700; font-size: calc(46 * var(--u)); line-height: 1.1; letter-spacing: -0.005em; }
  #role { font-weight: 500; font-size: calc(28 * var(--u)); line-height: 1.3; color: rgb(255 255 255 / 0.82); margin-top: calc(4 * var(--u)); }
</style>
</head>
<body>
<div class="third">
  <div class="rule" id="rule"></div>
  <div class="mask"><span class="line" id="name"></span></div>
  <div class="mask"><span class="line" id="role"></span></div>
</div>
<script>
  document.documentElement.style.setProperty('--u', innerHeight / 1080 + 'px');
  const { ease, clamp } = direction;
  const duration = 5;

  // 0 → 1 over `length` seconds from `start`.
  const between = (t, start, length) => clamp((t - start) / length);

  direction.graphic({
    duration,
    words: {
      name: { label: 'Name', text: 'Maya Chen', max: 32 },
      role: { label: 'Role', text: 'Founder, Northwind', max: 44 },
    },
    render(t, words) {
      document.getElementById('name').textContent = words.name;
      document.getElementById('role').textContent = words.role;
      const out = ease.inOut(between(t, duration - 0.9, 0.6));
      rule.style.transform = `scaleX(${ease.out(between(t, 0.2, 0.5)) * (1 - out)})`;
      const name = ease.out(between(t, 0.35, 0.6)), role = ease.out(between(t, 0.55, 0.6));
      document.getElementById('name').style.transform = `translateY(${(1 - name + out) * 110}%)`;
      document.getElementById('role').style.transform = `translateY(${(1 - role + out) * 110}%)`;
    },
  });
</script>
</body>
</html>
