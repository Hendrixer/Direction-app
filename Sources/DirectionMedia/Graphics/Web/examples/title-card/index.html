<!doctype html>
<!--
  Title card. One line, centered low in the frame, that fades up, holds and goes.
  Start here for a film's title, a time card ("Two years later.") or a place.

  How every example is written:
  - Every visible word comes from `words`, so the director can fix a typo without a round trip.
    `max` is how many characters the layout holds; the director can't type more.
  - Sizes are written at 1080p and scaled by --u (1u is one pixel at 1080p), so the card looks the
    same at any picture size.
  - render(t, words) draws the whole frame for time t, in seconds. Nothing animates on its own,
    so any frame can be drawn in any order and every render is the same.
  - One typeface (Archivo, bundled), generous space, short and calm motion.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --u: 1px; }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #title {
    position: absolute; left: 0; right: 0; top: calc(742 * var(--u));
    margin: 0; text-align: center;
    font: 700 calc(64 * var(--u)) / 1 'Archivo', sans-serif;
    letter-spacing: -0.005em;
    color: rgb(255 255 255 / 0.92);
  }
</style>
</head>
<body>
<h1 id="title"></h1>
<script>
  document.documentElement.style.setProperty('--u', innerHeight / 1080 + 'px');
  const u = innerHeight / 1080;
  const { ease, clamp } = direction;
  const duration = 4;

  direction.graphic({
    duration,
    words: {
      title: { label: 'Title', text: 'Two years.', max: 40 },
    },
    render(t, words) {
      title.textContent = words.title;
      // Up over 0.8 s from 0.3 s, rising 12 px as it comes; gone by 0.2 s before the end.
      const shown = ease.out(clamp((t - 0.3) / 0.8));
      const gone = ease.inOut(clamp((t - (duration - 0.8)) / 0.6));
      title.style.opacity = shown * (1 - gone);
      title.style.transform = `translateY(${(1 - shown) * 12 * u}px)`;
    },
  });
</script>
</body>
</html>
