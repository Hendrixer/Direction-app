<!doctype html>
<!-- The share image (public/og.png, 1200×630) and the icons. Rendered by tools/render-og.sh with headless Chrome. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Archivo"; src: url("../public/fonts/archivo.woff2") format("woff2"); font-weight: 400 800; font-stretch: 100% 125%; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; }
  .card { position: relative; width: 1200px; height: 630px; overflow: hidden; color: oklch(0.96 0.003 265); font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .card img.l { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 62% 58%; transform: scale(1.14); transform-origin: 28% 62%; }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(90deg, oklch(0 0 0 / .62), transparent 62%),
    linear-gradient(0deg, oklch(0 0 0 / .85) 0%, oklch(0 0 0 / .35) 30%, transparent 55%),
    linear-gradient(180deg, oklch(0 0 0 / .45), transparent 22%); }
  .grain { position: absolute; inset: 0; background: url("../public/img/grain.png"); opacity: .035; }
  .brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; font: 700 28px/1 "Archivo"; font-stretch: 125%; letter-spacing: -.01em; }
  .brand img { width: 34px; height: 34px; }
  h1 { position: absolute; left: 64px; bottom: 118px; font: 700 80px/.98 "Archivo"; font-stretch: 125%; letter-spacing: -.025em; }
  h1 span { display: block; white-space: nowrap; }
  h1 .dim { color: oklch(0.76 0.006 265); }
  .meta { position: absolute; left: 64px; right: 64px; bottom: 54px; display: flex; justify-content: space-between; font: 500 17px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; color: oklch(0.62 0.008 265); }
  .hud { position: absolute; right: 64px; top: 64px; font: 500 15px/1 "SF Mono", ui-monospace, Menlo, monospace; letter-spacing: .06em; color: oklch(0.7 0.008 265); display: flex; gap: 10px; align-items: center; }
  .hud i { width: 8px; height: 8px; border-radius: 50%; background: oklch(0.70 0.17 25); }

  /* Icons: the glyph on the app's near-black, rendered square */
  .icon { width: 512px; height: 512px; display: grid; place-items: center; background: radial-gradient(70% 70% at 50% 30%, oklch(0.24 0.006 265), oklch(0.13 0.003 265)); }
  .icon img { width: 62%; }
</style>
</head>
<body>
  <div class="card" id="og">
    <img class="l" src="../public/img/ridge-sky.svg" alt="">
    <img class="l" src="../public/img/ridge-far.svg" alt="">
    <img class="l" src="../public/img/ridge-near.svg" alt="">
    <div class="shade"></div>
    <div class="grain"></div>
    <div class="brand"><img src="../public/img/glyph.svg" alt="">Direction</div>
    <div class="hud"><i></i>A003 00:01:48:12</div>
    <h1><span>Direct the film</span><span class="dim">in your head.</span></h1>
    <div class="meta"><span>A Mac app for directors</span><span>givedirection.ai</span></div>
  </div>
  <div class="icon" id="icon"><img src="../public/img/glyph.svg" alt=""></div>
  <script>
    // ?icon shows only the icon, at the window's top-left.
    if (location.search.includes('icon')) document.getElementById('og').remove();
    else document.getElementById('icon').remove();
  </script>
</body>
</html>
